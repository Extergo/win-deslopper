project = "Deslopper"
milestone = "owner-mode-m2-task-view"

allow_real_windows_inspection = true
allow_fixed_read_only_windows_queries = true
allow_windows_mutation = true
allow_owner_mode = true
owner_mode_operation_ids = ["set_taskbar_widgets_visibility", "set_taskbar_task_view_visibility"]
owner_mode_requires_single_ui_apply = true
owner_mode_requires_exact_prestate = true
owner_mode_requires_durable_transaction = true
owner_mode_requires_direct_verification = true
owner_mode_requires_detector_verification = true
owner_mode_requires_conflict_safe_rollback = true
owner_mode_requires_stable_machine_user_scope = true
allow_internal_mutation_alpha = true
mutation_alpha_requires_debug_build = true
mutation_alpha_requires_compile_feature = true
mutation_alpha_requires_command_line_opt_in = true
mutation_alpha_requires_in_app_acknowledgement = true
mutation_alpha_requires_live_validation_opt_in = true
mutation_alpha_requires_scenario_manifest = true
mutation_alpha_requires_expected_machine_identity = true
mutation_alpha_requires_development_host_denylist = true
live_validation_policy_schema_version = 2
allow_live_mutation_only_in_explicitly_approved_disposable_target = true
allowed_live_validation_target_types = ["virtual_machine", "physical_laptop"]
physical_target_requires_strict_recovery_readiness = true
mutation_alpha_operation_count = 3
allow_elevation = false
allow_network_access = false
allow_backend = false
allow_authentication = false
allow_payments = false
allow_telemetry = false
allow_plugin_execution = false
allow_shell_execution = false
allow_unsafe_rust = false

quality_gates = [
    "bun install --frozen-lockfile",
    "cargo fmt --check",
    "cargo check",
    "cargo check --all-features",
    "cargo clippy --all-targets --all-features -- -D warnings",
    "cargo test",
    "cargo test --all-features",
    "bun run check",
    "bun run lint",
    "bun run test",
    "bun run build",
    "bun run tauri dev",
    "bun run tauri build --debug --no-bundle",
    "bun run tauri build --debug --no-bundle --features mutation-alpha",
    "bun run tauri build --no-bundle",
    "bun run tauri build",
    "powershell -ExecutionPolicy Bypass -File tools/scan-mutation-boundary.ps1",
]
