project = "Deslopper"
milestone = "mutation-alpha-live-validation-hardening"

allow_real_windows_inspection = true
allow_fixed_read_only_windows_queries = true
allow_windows_mutation = false
allow_internal_mutation_alpha = true
mutation_alpha_requires_debug_build = true
mutation_alpha_requires_compile_feature = true
mutation_alpha_requires_command_line_opt_in = true
mutation_alpha_requires_in_app_acknowledgement = true
mutation_alpha_requires_live_validation_opt_in = true
mutation_alpha_requires_scenario_manifest = true
mutation_alpha_requires_expected_machine_identity = true
mutation_alpha_requires_development_host_denylist = true
allow_live_mutation_only_in_explicitly_approved_disposable_vm = true
mutation_alpha_operation_count = 3
allow_elevation = false
allow_network_access = false
allow_backend = false
allow_authentication = false
allow_payments = false
allow_telemetry = false
allow_plugin_execution = false
allow_shell_execution = false
allow_unsafe_rust = false

quality_gates = [
    "bun install --frozen-lockfile",
    "cargo fmt --check",
    "cargo check",
    "cargo clippy --all-targets --all-features -- -D warnings",
    "cargo test",
    "cargo test --features mutation-alpha",
    "bun run check",
    "bun run lint",
    "bun run test",
    "bun run build",
    "bun run tauri build --debug --no-bundle",
    "bun run tauri build --debug --no-bundle --features mutation-alpha",
    "bun run tauri dev",
    "powershell -ExecutionPolicy Bypass -File tools/scan-mutation-boundary.ps1",
]
